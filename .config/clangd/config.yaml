# Global clangd config — applies to every project, every editor that speaks LSP.
# Managed by dotfiles (symlinked to ~/.config/clangd/config.yaml).
# See README "C/C++ & kernel development" for the compile_commands.json workflow.

CompileFlags:
  # Let kernel trees (built with GCC) index cleanly under clang.
  Add:
    - -Wno-unknown-warning-option
    - -Wno-unknown-attributes
    # Kernel -Werror plus clang's take on GCC flags blows clangd's 19-error
    # limit, after which it truncates diagnostics for the whole file.
    - -Wno-error
  # GCC/kernel-only; they never appear in user projects, so stripping is global.
  Remove:
    - -mpreferred-stack-boundary=*
    - -mno-fp-ret-in-387
    - -mskip-rax-setup
    - -mindirect-branch=*
    - -mindirect-branch-register
    - -mindirect-branch-cs-prefix
    - -mrecord-mcount
    - -mfentry
    - -mfunction-return=*
    - -mharden-sls=*
    - -mstack-protector-guard*
    - -fconserve-stack
    - -fno-allow-store-data-races
    - -fmin-function-alignment=*
    - -falign-jumps=*
    - -fno-var-tracking-assignments
    - -femit-struct-debug-baseonly
    - --param=*

Diagnostics:
  # clang-analyzer-* is already on by default.
  ClangTidy:
    Add:
      - bugprone-*
      - performance-*
      - portability-*
    Remove:
      - bugprone-easily-swappable-parameters

InlayHints:
  Enabled: true
  ParameterNames: true
  DeducedTypes: true

Index:
  Background: Build

Hover:
  ShowAKA: true
