# Shared GnuPG options for every machine. The one genuinely host-specific
# setting -- which pinentry binary can draw a passphrase prompt here -- lives
# in gpg-agent.conf, which install.sh generates per machine.
#
# Nothing secret belongs in this file: it is committed to a public repo.
# Secret key material moves between machines out of band; see bin/gpg-setup.

# Always print long key IDs. Short 32-bit IDs are cheap to collide, so a short
# ID in a log line is not evidence of which key was actually used.
keyid-format 0xlong

# Keep armored output reproducible and free of version banners, which
# otherwise show up as noise in the diff of every signed patch.
no-emit-version
no-comments

# keys.openpgp.org holds the published key. Note that gpg's own hkps transport
# is blocked on some corporate networks -- `gpg --send-keys` fails there with
# "Invalid argument" while plain HTTPS to the same host works. bin/gpg-setup
# --publish goes through the VKS HTTPS API for exactly that reason.
keyserver hkps://keys.openpgp.org

# The signing key is ed25519, so the digest is what actually decides strength.
personal-digest-preferences SHA512 SHA384 SHA256
cert-digest-algo SHA512
