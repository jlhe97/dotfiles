unbind C-b
set-option -g prefix C-a

unbind '"'
unbind %

bind r source-file ~/.tmux.conf

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

set -g mouse on

set-option -g allow-rename off

set -g set-clipboard on

# Cross-platform clipboard: pbcopy (macOS), wl-copy (Wayland), xclip (X11)
if-shell "uname | grep -q Darwin" {
    set -s copy-command 'pbcopy'
    bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'
} {
    if-shell "command -v wl-copy" {
        set -s copy-command 'wl-copy'
        bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'
        bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'
    } {
        set -s copy-command 'xclip -selection clipboard'
        bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard'
        bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard'
    }
}

set -sg escape-time 10 # make nvim less laggy with `ESC` key
set -g focus-events on # let nvim notice when files changed outside of it
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB" # set true color

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 100

# Per-OS: load average, and a color so nested tmux differs
if-shell "uname | grep -q Darwin" {
    set -g @load '#(sysctl -n vm.loadavg | cut -d" " -f2)'
    set -g status-style 'bg=colour22,fg=colour255'
} {
    set -g @load '#(cut -d" " -f1 /proc/loadavg)'
    set -g status-style 'bg=colour24,fg=colour255'
}

set -g status-left '#[bold] #S #{?client_prefix,#[reverse] ^A #[noreverse] ,}'
set -g status-right '#(git -C "#{pane_current_path}" branch --show-current 2>/dev/null)  load #{E:@load} #[fg=yellow]%Y-%m-%d %H:%M  '
setw -g window-status-format         ' #I #W#{?window_activity_flag,·,}#{?window_silence_flag,·,}#{?window_zoomed_flag, Z,} '
setw -g window-status-current-format '#[reverse,bold] #I #W#{?window_zoomed_flag, Z,} '
setw -g monitor-activity on
set -g visual-activity off
set -g visual-silence off

# Windows

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Alt+1..9 jumps, no prefix
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind C-a last-window # last recently used
bind a send-prefix # send literal

# cycling between windows
bind -r n next-window
bind -r p previous-window

# Fuzzy-pick any window
bind f display-popup -E "tmux list-windows -a -F '#S:#I  #W  #{pane_current_path}' | fzf --reverse | cut -d' ' -f1 | xargs tmux switch-client -t"

setw -g automatic-rename-format '#{b:pane_current_path}' # rename based on location
bind c new-window -c "#{pane_current_path}" # new windows at location
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
